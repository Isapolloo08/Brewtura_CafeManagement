<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <!--
    Brewtura Brand Logo — SVG Recreation
    Based on Brewtura_Logo.png

    Color Palette:
      Dark Brown : #2C1A0E
      Gold/Tan   : #C9924B
      Cream      : #F0D9A8
      White      : #FFFFFF
  -->

  <!-- ============================================================
       OVERALL OUTER SILHOUETTE
       Rounded square / squircle — the full logo boundary
  ============================================================ -->
  <rect x="10" y="10" width="480" height="480" rx="90" ry="90" fill="#2C1A0E"/>

  <!-- ============================================================
       WHITE VERTICAL DIVIDER (separates bean left from B right)
  ============================================================ -->
  <rect x="228" y="10" width="24" height="480" fill="white"/>

  <!-- ============================================================
       LEFT SIDE — Coffee Bean with Two S-curve Leaves
  ============================================================ -->

  <!-- The left half is the coffee bean dark fill (already covered by the outer rect above) -->

  <!-- LEAF 1 — left leaf (leftmost S-curve pair, outer gold stroke) -->
  <path
    d="M 145 55
       C 90 100, 75 160, 85 230
       C 95 300, 120 360, 135 445"
    stroke="#C9924B" stroke-width="28" stroke-linecap="round" fill="none"/>

  <!-- LEAF 1 — inner dark line to create the "outline only" look -->
  <path
    d="M 145 55
       C 90 100, 75 160, 85 230
       C 95 300, 120 360, 135 445"
    stroke="#2C1A0E" stroke-width="14" stroke-linecap="round" fill="none"/>

  <!-- LEAF 2 — right leaf (S-curve closer to center) -->
  <path
    d="M 200 42
       C 155 90, 148 155, 162 228
       C 176 300, 195 365, 205 448"
    stroke="#C9924B" stroke-width="28" stroke-linecap="round" fill="none"/>

  <!-- LEAF 2 — inner dark line -->
  <path
    d="M 200 42
       C 155 90, 148 155, 162 228
       C 176 300, 195 365, 205 448"
    stroke="#2C1A0E" stroke-width="14" stroke-linecap="round" fill="none"/>

  <!-- ============================================================
       RIGHT SIDE — Letter "B"
       The overall outer shape is already the dark rounded square.
       We carve out the B using white + cream + gold layers.
  ============================================================ -->

  <!-- TOP LOBE of the B -->
  <!-- Outermost white gap ring -->
  <path
    d="M 252 30
       L 340 30
       Q 460 30 460 130
       Q 460 235 340 235
       L 252 235
       Z"
    fill="white"/>

  <!-- Gold/tan ring inside -->
  <path
    d="M 252 58
       L 338 58
       Q 430 58 430 130
       Q 430 205 338 205
       L 252 205
       Z"
    fill="#C9924B"/>

  <!-- White ring inside gold -->
  <path
    d="M 252 88
       L 336 88
       Q 398 88 398 130
       Q 398 175 336 175
       L 252 175
       Z"
    fill="white"/>

  <!-- Dark brown inner fill (makes it look like open space) -->
  <path
    d="M 252 118
       L 334 118
       Q 366 118 366 130
       Q 366 144 334 144
       L 252 144
       Z"
    fill="#2C1A0E"/>

  <!-- BOTTOM LOBE of the B (slightly larger) -->
  <!-- Outermost white gap ring -->
  <path
    d="M 252 252
       L 356 252
       Q 490 252 490 375
       Q 490 470 356 470
       L 252 470
       Z"
    fill="white"/>

  <!-- Gold/tan ring inside -->
  <path
    d="M 252 282
       L 354 282
       Q 456 282 456 375
       Q 456 440 354 440
       L 252 440
       Z"
    fill="#C9924B"/>

  <!-- White ring inside gold -->
  <path
    d="M 252 312
       L 352 312
       Q 420 312 420 375
       Q 420 410 352 410
       L 252 410
       Z"
    fill="white"/>

  <!-- Dark brown inner fill -->
  <path
    d="M 252 342
       L 350 342
       Q 384 342 384 375
       Q 384 380 350 380
       L 252 380
       Z"
    fill="#2C1A0E"/>

  <!-- Cream highlight on bottom inner curve -->
  <path
    d="M 252 375
       L 350 375
       Q 384 375 384 375
       Q 384 408 350 408
       L 252 408
       Z"
    fill="#F0D9A8"/>

  <!-- ============================================================
       RE-DRAW WHITE DIVIDER ON TOP (so it cleanly separates)
  ============================================================ -->
  <rect x="228" y="10" width="24" height="480" fill="white"/>

</svg>
